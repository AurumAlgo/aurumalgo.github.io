<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AURUMALGO — Image Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #08080a; color: #fff;
    display: grid; grid-template-columns: 340px 1fr; min-height: 100vh;
  }
  .sidebar {
    background: #0a0d14;
    border-right: 1px solid rgba(255, 215, 0, 0.15);
    padding: 20px; overflow-y: auto; max-height: 100vh;
    position: sticky; top: 0;
  }
  .sidebar h1 {
    color: #FFD700; font-size: 16px; letter-spacing: 2px;
    margin-bottom: 18px; display: flex; align-items: center; gap: 8px;
  }
  .sidebar h1 .dm { font-size: 22px; }
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px;
  }
  .tab {
    padding: 10px 6px; background: #141820;
    border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 8px; color: #aaa; font-size: 11px;
    cursor: pointer; text-align: center; transition: all 0.15s;
    font-weight: 600;
  }
  .tab:hover { border-color: #FFD700; color: #FFD700; }
  .tab.active {
    background: #FFD700; color: #0a0d14;
    border-color: #FFD700; font-weight: 700;
  }
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 10px; color: #888;
    margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase;
    font-weight: 600;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 8px 11px;
    background: #141820;
    border: 1px solid rgba(255, 215, 0, 0.15);
    border-radius: 6px; color: #fff; font-size: 12px;
    font-family: inherit; outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: #FFD700; }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .btn {
    width: 100%; padding: 12px; background: #FFD700;
    color: #0a0d14; border: none; border-radius: 8px;
    font-weight: 700; font-size: 13px; cursor: pointer;
    margin-top: 8px; transition: all 0.15s; letter-spacing: 1px;
  }
  .btn:hover { background: #D4AF37; }
  .preview-area {
    padding: 40px 20px; display: flex;
    align-items: flex-start; justify-content: center;
    background: #08080a; overflow-x: auto;
  }
  .canvas {
    width: 1080px; height: 1080px;
    background: #0a0d14;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 60px 70px 50px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .canvas .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,215,0,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,215,0,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .canvas .glow {
    position: absolute; width: 500px; height: 500px;
    border-radius: 50%; filter: blur(120px); opacity: 0.35;
    pointer-events: none;
  }
  .canvas .glow-top { top: -200px; right: -100px; background: #FFD700; }
  .canvas .glow-bottom { bottom: -200px; left: -100px; background: #D4AF37; opacity: 0.2; }
  .canvas .corner { position: absolute; pointer-events: none; }
  .canvas .corner-tr {
    top: 40px; right: 40px; width: 120px; height: 120px;
    border: 2px solid rgba(255,215,0,0.15); transform: rotate(45deg);
  }
  .canvas .corner-bl {
    bottom: 40px; left: 40px; width: 120px; height: 120px;
    border: 2px solid rgba(255,215,0,0.15); transform: rotate(45deg);
  }
  .c-header {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 10;
    padding-bottom: 30px;
    border-bottom: 1px solid rgba(255,215,0,0.2);
  }
  .c-logo { display: flex; align-items: center; gap: 16px; }
  .c-logo-icon {
    width: 62px; height: 62px;
    background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
    display: flex; align-items: center; justify-content: center;
    color: #0a0d14; font-size: 34px; font-weight: 900;
    transform: rotate(45deg);
    box-shadow: 0 0 40px rgba(255,215,0,0.4);
  }
  .c-logo-icon span { transform: rotate(-45deg); }
  .c-logo-text { display: flex; flex-direction: column; gap: 2px; }
  .c-logo-name {
    color: #FFD700; font-size: 28px; font-weight: 900;
    letter-spacing: 4px; line-height: 1;
  }
  .c-logo-tag {
    color: #888; font-size: 12px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase;
  }
  .c-badge {
    padding: 10px 20px;
    background: rgba(255,215,0,0.12);
    border: 1.5px solid rgba(255,215,0,0.45);
    border-radius: 30px;
    color: #FFD700; font-size: 15px; font-weight: 700;
    letter-spacing: 1.5px;
    box-shadow: 0 0 25px rgba(255,215,0,0.15);
  }
  .c-body {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center;
    position: relative; z-index: 10;
    padding: 40px 0;
  }
  .c-footer {
    position: relative; z-index: 10;
    padding-top: 26px;
    border-top: 1px solid rgba(255,215,0,0.2);
    display: flex; flex-direction: column; gap: 14px;
  }
  .c-footer-main {
    display: flex; justify-content: space-between; align-items: center;
  }
  .c-footer-url {
    display: flex; align-items: center; gap: 10px;
    color: #FFD700; font-size: 22px; font-weight: 800;
    letter-spacing: 0.5px;
  }
  .c-footer-url .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #00e676; box-shadow: 0 0 12px #00e676;
  }
  .c-footer-socials { display: flex; gap: 22px; align-items: center; }
  .c-footer-social {
    display: flex; align-items: center; gap: 7px;
    color: #999; font-size: 14px; font-weight: 600;
    letter-spacing: 0.5px;
  }
  .c-footer-social .ico { color: #FFD700; font-size: 15px; }
  .c-footer-tagline {
    color: #555; font-size: 13px;
    letter-spacing: 3px; text-transform: uppercase;
    text-align: center; font-weight: 600;
  }
  .t-signal .sig-pair {
    font-size: 76px; font-weight: 900; color: #fff;
    letter-spacing: -1px; margin-bottom: 8px;
  }
  .t-signal .sig-dir {
    font-size: 130px; font-weight: 900; letter-spacing: 6px;
    line-height: 1; margin-bottom: 50px;
    text-shadow: 0 0 40px currentColor;
  }
  .t-signal .sig-dir.buy { color: #00e676; }
  .t-signal .sig-dir.sell { color: #ff1744; }
  .t-signal .sig-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  .t-signal .sig-item {
    background: linear-gradient(135deg, #141820 0%, #0f1219 100%);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 20px; padding: 26px 30px;
    position: relative; overflow: hidden;
  }
  .t-signal .sig-item::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 4px; height: 100%; background: #FFD700;
  }
  .t-signal .sig-item .lbl {
    color: #888; font-size: 14px; letter-spacing: 2.5px;
    text-transform: uppercase; margin-bottom: 8px; font-weight: 700;
  }
  .t-signal .sig-item .val {
    color: #FFD700; font-size: 40px; font-weight: 900;
    letter-spacing: -0.5px;
  }
  .t-track .tr-title {
    color: #888; font-size: 20px; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 24px; font-weight: 700;
  }
  .t-track .tr-return {
    font-size: 170px; font-weight: 900; color: #00e676;
    line-height: 0.9; letter-spacing: -8px;
    margin-bottom: 50px;
    text-shadow: 0 0 60px rgba(0,230,118,0.4);
  }
  .t-track .tr-return .pct { font-size: 100px; }
  .t-track .tr-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .t-track .tr-item {
    background: #141820;
    border: 1px solid rgba(255,215,0,0.18);
    border-radius: 18px; padding: 22px 16px; text-align: center;
  }
  .t-track .tr-item .val {
    font-size: 40px; font-weight: 900; color: #FFD700;
    margin-bottom: 6px; letter-spacing: -1px;
  }
  .t-track .tr-item .lbl {
    color: #777; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; font-weight: 700;
  }
  .t-edu .edu-ico {
    font-size: 90px; margin-bottom: 20px; line-height: 1;
  }
  .t-edu .edu-t {
    font-size: 58px; font-weight: 900; color: #fff;
    line-height: 1.05; margin-bottom: 36px;
    letter-spacing: -1.5px;
  }
  .t-edu .edu-b {
    font-size: 24px; line-height: 1.55; color: #c8c8c8;
    white-space: pre-wrap; font-weight: 500;
  }
  .t-ana .ana-pair {
    font-size: 62px; font-weight: 900; color: #fff;
    margin-bottom: 6px; letter-spacing: -1px;
  }
  .t-ana .ana-price {
    font-size: 42px; color: #FFD700; font-weight: 800;
    margin-bottom: 40px;
  }
  .t-ana .ana-lvls {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    margin-bottom: 30px;
  }
  .t-ana .ana-lvl {
    background: #141820; border-radius: 18px; padding: 26px 28px;
    position: relative; overflow: hidden;
  }
  .t-ana .ana-lvl.res::before {
    content: ''; position: absolute; left: 0; top: 0;
    width: 5px; height: 100%; background: #ff1744;
  }
  .t-ana .ana-lvl.sup::before {
    content: ''; position: absolute; left: 0; top: 0;
    width: 5px; height: 100%; background: #00e676;
  }
  .t-ana .ana-lvl .lbl {
    font-size: 14px; letter-spacing: 2.5px; text-transform: uppercase;
    color: #888; margin-bottom: 10px; font-weight: 700;
  }
  .t-ana .ana-lvl .val {
    font-size: 32px; font-weight: 900; color: #fff;
  }
  .t-ana .ana-sts {
    background: linear-gradient(90deg, rgba(255,215,0,0.1), rgba(255,215,0,0.03));
    border: 1.5px solid rgba(255,215,0,0.35);
    border-radius: 18px; padding: 24px 30px;
    font-size: 20px; color: #FFD700; font-weight: 700;
    display: flex; align-items: center; gap: 14px;
    letter-spacing: 0.5px;
  }
  .t-ana .ana-sts::before {
    content: '📊'; font-size: 26px; flex-shrink: 0;
  }
  .t-cmp .cmp-title {
    font-size: 44px; font-weight: 900; color: #fff;
    margin-bottom: 36px; letter-spacing: -1px;
  }
  .t-cmp .cmp-table {
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px;
  }
  .t-cmp .cmp-row-hdr {
    padding: 16px 14px; font-weight: 800; font-size: 15px;
    letter-spacing: 1.5px; text-transform: uppercase;
    text-align: center; border-radius: 12px;
  }
  .t-cmp .cmp-hdr-empty { background: transparent; }
  .t-cmp .cmp-hdr-free { background: rgba(0,230,118,0.12); color: #00e676; border: 1px solid rgba(0,230,118,0.4); }
  .t-cmp .cmp-hdr-pro { background: rgba(255,215,0,0.12); color: #FFD700; border: 1px solid rgba(255,215,0,0.4); }
  .t-cmp .cmp-hdr-vip { background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%); color: #0a0d14; }
  .t-cmp .cmp-label {
    padding: 14px 10px; color: #ccc; font-size: 15px;
    font-weight: 600; align-self: center;
  }
  .t-cmp .cmp-cell {
    padding: 14px 10px; text-align: center;
    background: #141820; border-radius: 10px;
    font-size: 15px; font-weight: 700; color: #fff;
    align-self: center;
    min-height: 52px; display: flex; align-items: center; justify-content: center;
  }
  .t-cmp .cmp-cell.yes { color: #00e676; font-size: 22px; }
  .t-cmp .cmp-cell.no { color: #ff1744; font-size: 22px; }
  .t-cmp .cmp-cell.highlight {
    background: rgba(255,215,0,0.12); color: #FFD700;
    border: 1px solid rgba(255,215,0,0.3);
  }
  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
</style>
</head>
<body>

<div class="sidebar">
  <h1><span class="dm">◆</span> AURUMALGO STUDIO</h1>

  <div class="tabs">
    <div class="tab active" data-t="signal">📈 Signal</div>
    <div class="tab" data-t="track">🏆 Track</div>
    <div class="tab" data-t="edu">💡 Educ</div>
    <div class="tab" data-t="ana">📊 Analysis</div>

  <div id="f-signal">

    <div class="field"><label>Risk : Reward</label><input id="sig-rr" value="1 : 2.3"></div>

  </div>

  <div id="f-track" style="display:none">
    <div class="field"><label>Title</label><input id="tr-title" value="AURUMALGO VIP — Champion"></div>
    <div class="field"><label>Return</label><input id="tr-return" value="+259.5"></div>
    <div class="field"><label>Win Rate</label><input id="tr-wr" value="58.9%"></div>
    <div class="field"><label>Return / DD</label><input id="tr-rr" value="14.4x"></div>
    <div class="field"><label>Trades</label><input id="tr-trades" value="90"></div>
    <div class="field"><label>Profit Factor</label><input id="tr-pf" value="1.91"></div>
    <div class="field"><label>Max DD</label><input id="tr-dd" value="18.1%"></div>
    <div class="field"><label>Badge</label><input id="tr-badge" value="🏆 TRACK RECORD"></div>
  </div>

  <div id="f-edu" style="display:none">
    <div class="field"><label>Icon</label><input id="edu-ic" value="🪜"></div>
    <div class="field"><label>Title</label><input id="edu-t" value="The Stair-Step Exit"></div>
    <div class="field"><label>Body</label><textarea id="edu-b">73% of my winning trades come from progressive exits — not fixed TP.

S1: Entry — initial risk
S2: At 1R → lock 0.5R
S3: At 1.15R → lock 0.9R

By S3, the trade is mathematically safe.</textarea></div>

  </div>

  <div id="f-ana" style="display:none">
    <div class="field"><label>Pair</label><input id="ana-pair" value="XAUUSD"></div>
    <div class="field"><label>Price</label><input id="ana-price" value="4,085.50"></div>
    <div class="field"><label>Resistance</label><input id="ana-res" value="4,130 / 4,150"></div>
    <div class="field"><label>Support</label><input id="ana-sup" value="4,060 / 4,030"></div>
    <div class="field"><label>Status</label><input id="ana-sts" value="Standby — waiting for London (07:00 UTC)"></div>

  <div id="f-cmp" style="display:none">
    <div class="field"><label>Title</label><input id="cmp-title" value="Choose Your Edition"></div>
    <div class="field"><label>Badge</label><input id="cmp-badge" value="⚖ COMPARISON"></div>
    <p style="color:#777;font-size:11px;margin-top:14px;line-height:1.5;">
      جدول مقایسه ۳ نسخه به‌صورت خودکار.
    </p>
  </div>

  <button class="btn" onclick="download()">⬇ DOWNLOAD PNG</button>
</div>

<div class="preview-area">
  <div class="canvas" id="canvas">
    <div class="bg-grid"></div>
    <div class="glow glow-top"></div>
    <div class="glow glow-bottom"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>

    <div class="c-header">
      <div class="c-logo">
        <div class="c-logo-icon"><span>A</span></div>
        <div class="c-logo-text">
          <div class="c-logo-name">AURUMALGO</div>
          <div class="c-logo-tag">The Gold Algorithm</div>
        </div>
      </div>
      <div class="c-badge" id="badge">⚡ PRIME SIGNAL</div>
    </div>

    <div class="c-body" id="body"></div>

    <div class="c-footer">
      <div class="c-footer-main">
        <div class="c-footer-url">
          <span class="dot"></span>
          <span>aurumalgo.github.io</span>
        </div>
        <div class="c-footer-socials">
          <div class="c-footer-social"><span class="ico">◆</span> @AurumAlgo</div>
          <div class="c-footer-social"><span class="ico">✉</span> aurumalgo.official</div>
        </div>
      </div>
      <div class="c-footer-tagline">Gold · XAUUSD · Algorithmic Trading</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const canvas = document.getElementById('canvas');
  const body = document.getElementById('body');
  const badge = document.getElementById('badge');
  let current = 'signal';

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      current = t.dataset.t;
      document.querySelectorAll('[id^="f-"]').forEach(x => x.style.display = 'none');
      document.getElementById('f-' + current).style.display = 'block';
      render();
    });
  });

  document.querySelectorAll('input, textarea, select').forEach(el => {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  function esc(t) {
    const d = document.createElement('div');
    d.textContent = t || '';
    return d.innerHTML;
  }

  function render() {
    canvas.className = 'canvas t-' + current;

    if (current === 'signal') {
      badge.textContent = document.getElementById('sig-badge').value;
      body.innerHTML = `
        <div class="sig-pair">${esc(document.getElementById('sig-pair').value)}</div>
        <div class="sig-dir ${document.getElementById('sig-dir').value}">
          ${document.getElementById('sig-dir').value === 'buy' ? 'BUY' : 'SELL'}
        </div>
        <div class="sig-grid">
          <div class="sig-item"><div class="lbl">Entry</div><div class="val">${esc(document.getElementById('sig-entry').value)}</div></div>
          <div class="sig-item"><div class="lbl">Stop Loss</div><div class="val">${esc(document.getElementById('sig-sl').value)}</div></div>
          <div class="sig-item"><div class="lbl">Take Profit</div><div class="val">${esc(document.getElementById('sig-tp').value)}</div></div>
          <div class="sig-item"><div class="lbl">Risk : Reward</div><div class="val">${esc(document.getElementById('sig-rr').value)}</div></div>
        </div>
      `;
    }

    else if (current === 'track') {
      badge.textContent = document.getElementById('tr-badge').value;
      const ret = document.getElementById('tr-return').value;
      const sign = ret.startsWith('-') ? '' : '+';
      const num = ret.replace(/^[+-]/, '');
      body.innerHTML = `
        <div class="tr-title">${esc(document.getElementById('tr-title').value)}</div>
        <div class="tr-return">${sign}${esc(num)}<span class="pct">%</span></div>
        <div class="tr-grid">
          <div class="tr-item"><div class="val">${esc(document.getElementById('tr-wr').value)}</div><div class="lbl">Win Rate</div></div>
          <div class="tr-item"><div class="val">${esc(document.getElementById('tr-rr').value)}</div><div class="lbl">Return / DD</div></div>
          <div class="tr-item"><div class="val">${esc(document.getElementById('tr-trades').value)}</div><div class="lbl">Trades</div></div>
          <div class="tr-item"><div class="val">${esc(document.getElementById('tr-pf').value)}</div><div class="lbl">Profit Factor</div></div>
          <div class="tr-item"><div class="val">${esc(document.getElementById('tr-dd').value)}</div><div class="lbl">Max DD</div></div>
          <div class="tr-item"><div class="val">★</div><div class="lbl">Champion</div></div>
        </div>
      `;
    }

    else if (current === 'edu') {
      badge.textContent = document.getElementById('edu-badge').value;
      body.innerHTML = `
        <div class="edu-ico">${esc(document.getElementById('edu-ic').value)}</div>
        <div class="edu-t">${esc(document.getElementById('edu-t').value)}</div>
        <div class="edu-b">${esc(document.getElementById('edu-b').value)}</div>
      `;
    }

    else if (current === 'ana') {
      badge.textContent = document.getElementById('ana-badge').value;
      body.innerHTML = `
        <div class="ana-pair">${esc(document.getElementById('ana-pair').value)}</div>
        <div class="ana-price">${esc(document.getElementById('ana-price').value)}</div>
        <div class="ana-lvls">
          <div class="ana-lvl res"><div class="lbl">🔴 Resistance</div><div class="val">${esc(document.getElementById('ana-res').value)}</div></div>
          <div class="ana-lvl sup"><div class="lbl">🟢 Support</div><div class="val">${esc(document.getElementById('ana-sup').value)}</div></div>
        </div>
        <div class="ana-sts">${esc(document.getElementById('ana-sts').value)}</div>
      `;
    }

    else if (current === 'cmp') {
      badge.textContent = document.getElementById('cmp-badge').value;
      body.innerHTML = `
        <div class="cmp-title">${esc(document.getElementById('cmp-title').value)}</div>
        <div class="cmp-table">
          <div class="cmp-row-hdr cmp-hdr-empty"></div>
          <div class="cmp-row-hdr cmp-hdr-free">FREE</div>
          <div class="cmp-row-hdr cmp-hdr-pro">PRO</div>

  function download() {
    if (typeof html2canvas === 'undefined') {
      alert('اینترنت لازم است برای بارگذاری کتابخانه.\n\nاگر آفلاین هستی، از پیش‌نمایش اسکرین‌شات بگیر (Win + Shift + S).');
      return;
    }
    const btn = document.querySelector('.btn');
    btn.disabled = true;
    btn.textContent = '⏳ GENERATING...';

    html2canvas(canvas, {
      backgroundColor: '#0a0d14',
      scale: 2,
      useCORS: true,
      logging: false
    }).then(el => {
      el.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `AURUMALGO_${current}_${ts}.png`;
        a.click();
        URL.revokeObjectURL(url);
        btn.disabled = false;
        btn.textContent = '⬇ DOWNLOAD PNG';
      });
    }).catch(() => {
      alert('خطا. صفحه را Refresh کن.');
      btn.disabled = false;
      btn.textContent = '⬇ DOWNLOAD PNG';
    });
  }

  render();
</script>

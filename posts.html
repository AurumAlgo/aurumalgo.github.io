// ============================================================
// ACTIONS
// ============================================================
function toggleCaption(id) {
  const el = document.getElementById('cap-' + id);
  el.classList.toggle('show');
}

function copyCaption(id) {
  const post = POSTS.find(p => p.id === id);
  if (!post) return;

  navigator.clipboard.writeText(post.caption).then(() => {
    showToast('✓ Caption copied!');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = post.caption;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ Caption copied!');
  });
}

function downloadPost(id) {
  const post = POSTS.find(p => p.id === id);
  if (!post) return;

  if (typeof html2canvas === 'undefined') {
    showToast('⚠ CDN offline — use Screenshot instead', true);
    return;
  }

  const card = document.querySelector(`.post-card[data-cat="${post.cat}"]`);

  // Build a fresh full-size canvas off-screen
  const stage = document.createElement('div');
  stage.style.position = 'fixed';
  stage.style.left = '-99999px';
  stage.style.top = '0';
  stage.style.width = '1080px';
  stage.style.height = '1080px';
  stage.innerHTML = `
    <div style="width:1080px;height:1080px;background:#0a0d14;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:60px 70px 50px;font-family:-apple-system,system-ui,sans-serif;"
         id="bigCanvas-${post.id}"></div>`;
  document.body.appendChild(stage);

  const big = stage.querySelector('#bigCanvas-' + post.id);
  big.innerHTML = buildBigCanvas(post);

  const btns = document.querySelectorAll('.btn-img');
  btns.forEach(b => b.disabled = true);

  setTimeout(() => {
    html2canvas(big, {
      backgroundColor: '#0a0d14',
      scale: 2,
      useCORS: true,
      logging: false,
      width: 1080,
      height: 1080
    }).then(el => {
      el.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AURUMALGO_${post.id}.png`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('✓ Downloaded!');
        document.body.removeChild(stage);
        btns.forEach(b => b.disabled = false);
      });
    }).catch(() => {
      showToast('⚠ Error — try again', true);
      document.body.removeChild(stage);
      btns.forEach(b => b.disabled = false);
    });
  }, 100);
}

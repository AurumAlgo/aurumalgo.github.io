let plat='telegram', sub='all';
const platTabs=document.getElementById('platTabs');
const subTabs=document.getElementById('subTabs');
const container=document.getElementById('container');
const toast=document.getElementById('toast');
const cnt=document.getElementById('cnt');

function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML}

function renderPlat(){
  platTabs.innerHTML=Object.entries(DATA).map(([k,v])=>
    `<button data-p="${k}" class="${k===plat?'active':''}">${v.name}</button>`
  ).join('');
  platTabs.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{plat=b.dataset.p;sub='all';renderPlat();renderSubs();renderCards()};
  });
}

function renderSubs(){
  subTabs.innerHTML=DATA[plat].subs.map(s=>
    `<button data-s="${s.id}" class="${s.id===sub?'active':''}">${s.label}</button>`
  ).join('');
  subTabs.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{sub=b.dataset.s;renderSubs();renderCards()};
  });
}

function renderCards(){
  const posts=sub==='all'?DATA[plat].posts:DATA[plat].posts.filter(p=>p.sub===sub);
  cnt.textContent=posts.length+' Posts';
  if(!posts.length){container.innerHTML='<div class="empty">هیچ پستی نیست</div>';return}
  container.innerHTML=posts.map((p,i)=>`
    <div class="card">
      <div class="head">
        <div class="title">${esc(p.title)}</div>
        <div class="badge">${esc(p.cat)}</div>
      </div>
      <pre id="txt-${plat}-${i}">${esc(p.text)}</pre>
      ${p.note?`<div class="note">${esc(p.note)}</div>`:''}
      <div class="actions">
        <button class="btn" onclick="copyPost(${i})">📋 Copy Text</button>
      </div>
    </div>
  `).join('');
}

function copyPost(i){
  const posts=sub==='all'?DATA[plat].posts:DATA[plat].posts.filter(p=>p.sub===sub);
  if(!posts[i])return;
  const t=posts[i].text;
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(showToast).catch(fallback);
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=t;
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);showToast();
  }
}

function showToast(){
  toast.classList.add('show');
  clearTimeout(window._t);
  window._t=setTimeout(()=>toast.classList.remove('show'),1500);
}

renderPlat();renderSubs();renderCards();
